kind = "web"
previewPath = "/"
title = "Grooming Galore"
version = "1.0.0"
id = "artifacts/grooming-galore"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22356

[services.development]
run = "pnpm --filter @workspace/grooming-galore run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/grooming-galore", "run", "build" ]
publicDir = "artifacts/grooming-galore/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22356"
BASE_PATH = "/"
